name = "neptune"
main = "src/index.ts"
compatibility_date = "2026-05-30"

[vars]
REUSE_CAPTCHA = "true"

[[d1_databases]]
binding = "db"
database_name = "<YOUR_DATABASE_NAME>"
database_id = "<YOUR_DATABASE_ID>"

[[r2_buckets]]
bucket_name = "<YOUR_BUCKET_NAME>"
binding = "captcha"

[[kv_namespaces]]
binding = "aiContext"
id = "<YOUR_KV_NAMESPACE_ID>"

# MIMO_API_KEY is set as a secret (wrangler secret put MIMO_API_KEY)
