name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  BINARY_NAME: neptune

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Generate templ
        run: make generate

      - name: Build Linux binary
        run: make build-prod

      - name: Verify binary
        run: file ./bin/neptune && ls -lh ./bin/neptune

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            mkdir -p /opt/neptune/{data/captcha,migrations,deploy,static}
            chown -R neptune:neptune /opt/neptune

      - name: Upload binary
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "bin/neptune"
          target: "/opt/neptune/"
          strip_components: 2

      - name: Upload migrations
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "migrations/"
          target: "/opt/neptune/"
          strip_components: 1

      - name: Upload deploy scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "deploy/"
          target: "/opt/neptune/"
          strip_components: 1

      - name: Restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            chmod +x /opt/neptune/neptune
            chown neptune:neptune /opt/neptune/neptune
            systemctl restart neptune
            sleep 2
            systemctl status neptune --no-pager

      - name: Verify health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            curl -sf http://127.0.0.1:8080/health || echo "Health check failed"
